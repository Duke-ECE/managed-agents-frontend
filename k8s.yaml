apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-template
  labels:
    app: react-template
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react-template
  template:
    metadata:
      labels:
        app: react-template
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: nginx
          image: ghcr.io/duke-ece/react-template:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: react-template
  labels:
    app: react-template
spec:
  type: ClusterIP
  selector:
    app: react-template
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: react-template
  labels:
    app: react-template
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - managed-agents.colab.duke.edu
      secretName: managed-agents-frontend-tls
  rules:
    - host: managed-agents.colab.duke.edu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: react-template
                port:
                  number: 80
