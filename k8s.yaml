apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-template
  labels:
    app: react-template
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react-template
  template:
    metadata:
      labels:
        app: react-template
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: nginx
          image: ghcr.io/duke-ece/react-template:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: react-template
  labels:
    app: react-template
spec:
  type: NodePort
  selector:
    app: react-template
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
